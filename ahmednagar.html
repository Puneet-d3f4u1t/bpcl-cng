<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BPCL CNG Gas Station Locator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(180deg, #0066B3 0%, #004B87 100%);
      min-height: 100vh;
    }
    .bpcl-top-bar {
      height: 6px;
      background: #FFE600;
      width: 100%;
    }
    .station-block {
      transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
    }
    .station-block:hover {
      transform: translateY(-2px);
      filter: brightness(1.07);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
    }
    .station-block:active {
      transform: scale(0.99);
    }
    /* Online 24x7 Station - Green */
    .block-online {
      background-color: #15803D;
      border: 1px solid rgba(255, 255, 255, 0.22);
    }
    /* Daughter Booster Station (DBS) - BPCL Deep Navy Blue */
    .block-dbs {
      background-color: #002F5F;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
  </style>
</head>
<body class="text-white antialiased selection:bg-yellow-300 selection:text-blue-900">

  <!-- BPCL Yellow Top Accent Bar -->
  <div class="bpcl-top-bar"></div>

  <!-- Main Container -->
  <main class="max-w-xl mx-auto px-4 pt-8 pb-16 flex flex-col items-center">

    <!-- Circular White Badge with Linked PNG Logo -->
    <div class="w-40 h-40 rounded-full bg-white flex items-center justify-center mb-5 p-3 shadow-2xl border-4 border-white overflow-hidden">
      <img src="BPCL%20Gas%20Logo.png" alt="BPCL Gas Logo" class="w-full h-auto object-contain" />
    </div>

    <!-- Clean Title & Subtitle -->
    <h1 class="text-2xl sm:text-3xl font-extrabold tracking-wide text-center uppercase text-white">
      BPCL CNG GAS STATION
    </h1>
    <p class="text-sm sm:text-base text-blue-100 mt-1 mb-5 text-center font-medium">
      Find the Nearest Gas Stations
    </p>

    <!-- Compact Color Legend & GPS Nearest Button -->
    <div class="flex flex-wrap items-center justify-center gap-2.5 mb-6 text-xs font-semibold">
      <button onclick="setFilter('all')" id="btn-all" class="px-3 py-1.5 rounded-full bg-white text-blue-900 shadow-sm font-bold transition">
        All (13)
      </button>
      <button onclick="setFilter('Online')" id="btn-online" class="px-3 py-1.5 rounded-full bg-green-700/90 text-white border border-white/30 flex items-center gap-1.5 transition">
        <span class="w-2 h-2 rounded-full bg-green-300"></span> Online 24x7 (10)
      </button>
      <button onclick="setFilter('DBS')" id="btn-dbs" class="px-3 py-1.5 rounded-full bg-[#002F5F] text-white border border-white/30 flex items-center gap-1.5 transition">
        <span class="w-2 h-2 rounded-full bg-blue-300"></span> DBS (3)
      </button>
      <button onclick="locateNearest()" id="gps-btn" class="px-3 py-1.5 rounded-full bg-[#FFE600] text-[#003B70] font-bold shadow-sm hover:bg-yellow-300 transition">
        📍 Nearest First
      </button>
    </div>

    <!-- Station Blocks List -->
    <div id="stations-list" class="w-full space-y-3.5"></div>

    <!-- Total Visit Counter Badge -->
    <div class="mt-10 pt-4 border-t border-white/15 w-full flex flex-col items-center justify-center text-xs text-blue-100/90 gap-1">
      <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-[#002F5F]/80 border border-white/20 shadow-inner">
        <span class="w-2 h-2 rounded-full bg-[#FFE600] animate-pulse"></span>
        <span>Total Visit:</span>
        <span id="scan-count" class="font-extrabold text-[#FFE600] text-sm tracking-wider">...</span>
      </div>
    </div>

  </main>

  <script>
    const stations = [
      { name: "SHRI SAMARTH MULTISERVICES", location: "AHMEDNAGAR", type: "Online", lat: 18.929899, lng: 74.488177 },
      { name: "ASHWIN AUTOMOBILES", location: "AHMEDNAGAR", type: "Online", lat: 19.030196, lng: 74.638797 },
      { name: "B. G. R. PETROLEUM", location: "AHMEDNAGAR", type: "Online", lat: 19.049174, lng: 74.675104 },
      { name: "Kanan Petroleum", location: "AHMEDNAGAR", type: "Online", lat: 18.6022974943955, lng: 74.6821851533243 },
      { name: "NEW AGE FUEL WORLD", location: "AHMEDNAGAR", type: "Online", lat: 19.167408, lng: 74.698978 },
      { name: "VITTHAL HIGHWAY SERVICES", location: "AHMEDNAGAR", type: "Online", lat: 19.187543, lng: 74.77118 },
      { name: "SHREE SAI ROHIT SERVICES", location: "AHMEDNAGAR", type: "Online", lat: 19.39097, lng: 74.890615 },
      { name: "VISHAL FUEL STATION", location: "AHMEDNAGAR", type: "Online", lat: 19.009528, lng: 74.714571 },
      { name: "DEEPAK FUEL WORLD", location: "AHMEDNAGAR", type: "DBS", lat: 19.113583, lng: 74.730405 },
      { name: "ANAND PETROLEUM", location: "AHMEDNAGAR", type: "DBS", lat: 19.068864, lng: 74.725709 },
      { name: "VAISHNAVI PETROLEUM", location: "AHMEDNAGAR", type: "Online", lat: 18.924516, lng: 74.482309 },
      { name: "BAN BRO METALS PVT. LTD.", location: "AHMEDNAGAR", type: "Online", lat: 19.145706, lng: 74.693893 },
      { name: "CHAITANYA PETROLEUM", location: "AHMEDNAGAR", type: "DBS", lat: 19.600823, lng: 74.183782 }
    ];

    let activeFilter = 'all';

    function renderStations() {
      const container = document.getElementById('stations-list');
      const filtered = stations.filter(s => activeFilter === 'all' || s.type === activeFilter);

      container.innerHTML = filtered.map(s => {
        const blockClass = s.type === 'Online' ? 'block-online' : 'block-dbs';
        const mapUrl = `https://www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lng}`;
        
        // Show only road distance in km
        const distBadge = s.roadKm !== undefined ? ` (${s.roadKm.toFixed(1)} km)` : '';

        return `
          <a href="${mapUrl}" target="_blank" rel="noopener noreferrer"
             class="station-block ${blockClass} block w-full py-4 px-5 rounded-xl text-center shadow-md">
            <span class="text-[15px] sm:text-base font-semibold text-white underline underline-offset-4 decoration-white/80">
              ${s.name}, ${s.location}${distBadge}
            </span>
          </a>
        `;
      }).join('');
    }

    function setFilter(filter) {
      activeFilter = filter;
      document.getElementById('btn-all').className = filter === 'all'
        ? 'px-3 py-1.5 rounded-full bg-white text-blue-900 shadow-sm font-bold transition'
        : 'px-3 py-1.5 rounded-full bg-blue-900/50 text-white border border-white/25 transition';
      renderStations();
    }

    // Fallback formula if OSRM server is unreachable
    function getFallbackRoadKm(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const straightKm = R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return straightKm * 1.28;
    }

    // Fetch real driving road distances via OSRM Table API
    async function locateNearest() {
      const btn = document.getElementById('gps-btn');
      if (!navigator.geolocation) {
        alert('Geolocation is not supported by your browser.');
        return;
      }

      btn.textContent = 'Calculating Road Distance...';

      navigator.geolocation.getCurrentPosition(async (pos) => {
        const userLat = pos.coords.latitude;
        const userLng = pos.coords.longitude;

        try {
          const coordsList = [
            `${userLng},${userLat}`,
            ...stations.map(s => `${s.lng},${s.lat}`)
          ].join(';');

          const osrmUrl = `https://router.project-osrm.org/table/v1/driving/${coordsList}?sources=0&annotations=distance`;
          const response = await fetch(osrmUrl);
          const data = await response.json();

          if (data.code === 'Ok' && data.distances && data.distances[0]) {
            stations.forEach((s, idx) => {
              const distMeters = data.distances[0][idx + 1];
              s.roadKm = distMeters !== null ? (distMeters / 1000) : getFallbackRoadKm(userLat, userLng, s.lat, s.lng);
            });
          } else {
            throw new Error('OSRM response invalid');
          }
        } catch (err) {
          stations.forEach(s => {
            s.roadKm = getFallbackRoadKm(userLat, userLng, s.lat, s.lng);
          });
        }

        stations.sort((a, b) => a.roadKm - b.roadKm);
        btn.textContent = '✓ Sorted by Road Distance';
        renderStations();
      }, () => {
        btn.textContent = '📍 Nearest First (Allow GPS)';
      }, {
        enableHighAccuracy: true,
        timeout: 10000
      });
    }

    // Live Total Visit Counter (Increments +1 on every page open / refresh)
    async function updateScanCounter() {
      const counterEl = document.getElementById('scan-count');
      const namespace = 'puneet-d3f4u1t-bpcl-cng-ahmednagar';
      const key = 'qr-scans';

      try {
        const endpoint = `https://api.counterapi.dev/v1/${namespace}/${key}/up?t=${Date.now()}`;
        const res = await fetch(endpoint, { cache: 'no-store' });
        const data = await res.json();

        if (data && typeof data.count === 'number') {
          counterEl.textContent = data.count.toLocaleString('en-IN');
        } else {
          throw new Error('Primary counter invalid');
        }
      } catch (e) {
        const localCount = parseInt(localStorage.getItem('bpcl_anr_visit_fallback') || '0', 10) + 1;
        localStorage.setItem('bpcl_anr_visit_fallback', localCount);
        counterEl.textContent = localCount.toLocaleString('en-IN');
      }
    }

    renderStations();
    updateScanCounter();
  </script>
</body>
</html>
