<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BPCL CNG Gas Station Locator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(180deg, #0066B3 0%, #004B87 100%);
      min-height: 100vh;
    }
    .bpcl-top-bar {
      height: 6px;
      background: #FFE600;
      width: 100%;
    }
    .station-block {
      transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
    }
    .station-block:hover {
      transform: translateY(-2px);
      filter: brightness(1.07);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
    }
    .station-block:active {
      transform: scale(0.99);
    }
    /* Online 24x7 Station - Green */
    .block-online {
      background-color: #15803D;
      border: 1px solid rgba(255, 255, 255, 0.22);
    }
    /* Daughter Booster Station (DBS) - BPCL Deep Navy Blue */
    .block-dbs {
      background-color: #002F5F;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
  </style>
</head>
<body class="text-white antialiased selection:bg-yellow-300 selection:text-blue-900">

  <!-- BPCL Yellow Top Accent Bar -->
  <div class="bpcl-top-bar"></div>

  <!-- Main Container -->
  <main class="max-w-xl mx-auto px-4 pt-8 pb-16 flex flex-col items-center">

    <!-- Circular White Badge with Linked PNG Logo -->
    <div class="w-40 h-40 rounded-full bg-white flex items-center justify-center mb-5 p-3 shadow-2xl border-4 border-white overflow-hidden">
      <img src="BPCL%20Gas%20Logo.png" alt="BPCL Gas Logo" class="w-full h-auto object-contain" />
    </div>

    <!-- Clean Title & Subtitle -->
    <h1 class="text-2xl sm:text-3xl font-extrabold tracking-wide text-center uppercase text-white">
      BPCL CNG GAS STATION
    </h1>
    <p class="text-sm sm:text-base text-blue-100 mt-1 mb-5 text-center font-medium">
      Find the Nearest Gas Stations
    </p>

    <!-- Compact Color Legend & GPS Nearest Button -->
    <div class="flex flex-wrap items-center justify-center gap-2.5 mb-6 text-xs font-semibold">
      <button onclick="setFilter('all')" id="btn-all" class="px-3 py-1.5 rounded-full bg-white text-blue-900 shadow-sm transition">
        All (25)
      </button>
      <button onclick="setFilter('Online')" id="btn-online" class="px-3 py-1.5 rounded-full bg-green-700/90 text-white border border-white/30 flex items-center gap-1.5 transition">
        <span class="w-2 h-2 rounded-full bg-green-300"></span> Online 24x7 (10)
      </button>
      <button onclick="setFilter('DBS')" id="btn-dbs" class="px-3 py-1.5 rounded-full bg-[#002F5F] text-white border border-white/30 flex items-center gap-1.5 transition">
        <span class="w-2 h-2 rounded-full bg-blue-300"></span> DBS (15)
      </button>
      <button onclick="locateNearest()" id="gps-btn" class="px-3 py-1.5 rounded-full bg-[#FFE600] text-[#003B70] font-bold shadow-sm hover:bg-yellow-300 transition">
        📍 Nearest First
      </button>
    </div>

    <!-- Station Blocks List -->
    <div id="stations-list" class="w-full space-y-3.5"></div>

  </main>

  <script>
    const stations = [
      // Online Stations (Green - 24x7 Available)
      { name: "Adhoc Vinod", location: "Chikalthana", type: "Online", lat: 19.865459, lng: 75.421121 },
      { name: "Narmada Petroleum (HPCL)", location: "Beed Bypass", type: "Online", lat: 19.849829, lng: 75.336131 },
      { name: "BP Shendra", location: "Ladgaon, Shendra", type: "Online", lat: 19.868123, lng: 75.514303 },
      { name: "BP Waluj", location: "Shivara Fata, Waluj", type: "Online", lat: 19.781439, lng: 75.199464 },
      { name: "Saraswati Fuel Home", location: "Zalta Fata", type: "Online", lat: 19.850328, lng: 75.42883 },
      { name: "Sai Krishna & Sons", location: "Gangapur Road, Waluj", type: "Online", lat: 19.746774, lng: 75.143974 },
      { name: "Uma Refueling", location: "Waluj MIDC", type: "Online", lat: 19.84852, lng: 75.21545 },
      { name: "Nilesh Petroleum", location: "Gangapur Road", type: "Online", lat: 19.69859, lng: 75.07034 },
      { name: "Radhika Petroleum", location: "Gangapur Road, Waluj", type: "Online", lat: 19.70538, lng: 75.09194 },
      { name: "Samruddhi Petroleum", location: "Opp. Bajaj", type: "Online", lat: 19.82314, lng: 75.2447 },

      // Daughter Booster Stations (DBS - Blue)
      { name: "S R Petroleum", location: "Zalta Fata", type: "DBS", lat: 19.836226, lng: 75.432764 },
      { name: "Tulja Mata Petroleum", location: "Karodi", type: "DBS", lat: 19.88416, lng: 75.201276 },
      { name: "NBS Petroleum", location: "Kasabkheda Phata, NH 52, Varzadi", type: "DBS", lat: 19.966476, lng: 75.133008 },
      { name: "Harne Petroleum", location: "Harsul Talav, Jatwada Road", type: "DBS", lat: 19.921711, lng: 75.336877 },
      { name: "Ganesh Petroleum", location: "Farula Fata, Paithan", type: "DBS", lat: 19.738054, lng: 75.293952 },
      { name: "Yash Petroleum", location: "Hatanur, Tq. Kannad", type: "DBS", lat: 20.150815, lng: 75.129448 },
      { name: "Pandav Petroleum", location: "Sawangi, Tq. Gangapur", type: "DBS", lat: 19.914497, lng: 75.024351 },
      { name: "Navbharat Petroleum", location: "Sundarwadi, Jalna Road", type: "DBS", lat: 19.862216, lng: 75.445377 },
      { name: "Mahesh Petroleum", location: "Bidkin, Paithan Road", type: "DBS", lat: 19.683346, lng: 75.316983 },
      { name: "Pardeshwar Petroleum", location: "Kasabkheda Phata, Verul Road", type: "DBS", lat: 19.99088, lng: 75.128169 },
      { name: "Arihant Auto Centre", location: "Waluj Road, AS Club", type: "DBS", lat: 19.847334, lng: 75.267061 },
      { name: "Harsh Petroleum", location: "Maliwada", type: "DBS", lat: 19.927776, lng: 75.203922 },
      { name: "Jai Balaji Travels", location: "Kanchanwadi, Paithan Road", type: "DBS", lat: 19.836338, lng: 75.29189 },
      { name: "Shri Rajureshwar Petrol & Fuel Centre", location: "Pokhari, Cambridge", type: "DBS", lat: 19.923918, lng: 75.389399 },
      { name: "Parason Petroleum", location: "Georai Tanda", type: "DBS", lat: 19.797361, lng: 75.290183 }
    ];

    let activeFilter = 'all';

    function renderStations() {
      const container = document.getElementById('stations-list');
      const filtered = stations.filter(s => activeFilter === 'all' || s.type === activeFilter);

      container.innerHTML = filtered.map(s => {
        const blockClass = s.type === 'Online' ? 'block-online' : 'block-dbs';
        const mapUrl = `https://www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lng}`;
        const distText = s.distance !== undefined ? ` (${s.distance.toFixed(1)} km)` : '';

        return `
          <a href="${mapUrl}" target="_blank" rel="noopener noreferrer"
             class="station-block ${blockClass} block w-full py-4 px-5 rounded-xl text-center shadow-md">
            <span class="text-[15px] sm:text-base font-semibold text-white underline underline-offset-4 decoration-white/80">
              ${s.name}, ${s.location}${distText}
            </span>
          </a>
        `;
      }).join('');
    }

    function setFilter(filter) {
      activeFilter = filter;
      document.getElementById('btn-all').className = filter === 'all'
        ? 'px-3 py-1.5 rounded-full bg-white text-blue-900 shadow-sm font-bold transition'
        : 'px-3 py-1.5 rounded-full bg-blue-900/50 text-white border border-white/25 transition';
      renderStations();
    }

    function getDistanceKm(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function locateNearest() {
      const btn = document.getElementById('gps-btn');
      if (!navigator.geolocation) return;
      btn.textContent = 'Locating...';
      navigator.geolocation.getCurrentPosition(pos => {
        stations.forEach(s => {
          s.distance = getDistanceKm(pos.coords.latitude, pos.coords.longitude, s.lat, s.lng);
        });
        stations.sort((a, b) => a.distance - b.distance);
        btn.textContent = '✓ Sorted by Nearest';
        renderStations();
      }, () => {
        btn.textContent = '📍 Nearest First';
      });
    }

    renderStations();
  </script>
</body>
</html>
